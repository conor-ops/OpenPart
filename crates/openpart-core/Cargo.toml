[package]
name = "openpart-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mahmadabid/OpenPart"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10.9"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com"
] }

