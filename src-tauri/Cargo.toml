[package]
name = "openpart-gui"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mahmadabid/OpenPart"

[build-dependencies]
tauri-build = "1"

[dependencies]
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openpart-core = { path = "../crates/openpart-core" }
openpart-service = { path = "../crates/openpart-service" }
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl"
] }

